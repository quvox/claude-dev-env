# =============================================================================
#  .codex/config.toml — このプロジェクトで codex を起こしたときの砂箱と承認の既定
#
#  **codex はこのファイルを、プロジェクトのルートから作業ディレクトリまで辿って読む。**
#  読むのは `$CODEX_HOME/config.toml`(既定は `~/.codex/config.toml`)の**後**で、
#  同じキーはこちらが勝つ。
#
#  ★ **信頼していないプロジェクトでは丸ごと無視される。**
#    clone してきたリポジトリが、設定ファイルを同梱するだけで自分に広い権限を
#    与えられてしまわないための仕組みである。**効いていないと思ったら、まずこれを疑う。**
#    そのディレクトリで一度 `codex` を対話で起動し、信頼を与えると
#    `~/.codex/config.toml` の `[projects."<絶対パス>"]` に残り、以後このファイルが効く。
#
#  ★ **なぜ置くか。** 置かないと、codex は書き込みやコマンドの実行のたびに人間へ問い、
#    **そのウィンドウはそこで止まる。** 艦隊は無人で回るものなので、止まったウィンドウは
#    落ちたのと区別が付かない(`.claude/directions/orchestration.md` §1.1.1)。
#
#  ★ **起動行が渡す `--sandbox` / `--ask-for-approval` のほうが強い。**
#    `.claude/scripts/launch-agent.py` は**エージェントとして起こす codex に必ず
#    `--sandbox danger-full-access --ask-for-approval never` を渡す**(2026-09-20。
#    役でもホストでも分かれない)。ここが効くのは、**人間が素の `codex` を打ったとき**と、
#    艦隊の外で使うときである。**二重になっているのは意図的で**、片方だけにすると
#    落とした側がそのまま「止まるウィンドウ」になる。
# =============================================================================

# sandbox_mode は書かない。既存 CODEX_HOME の設定を変えないためであり、
# **艦隊の起動行はどのみちこの値を上書きする**(`danger-full-access`)。
# ここの [sandbox_workspace_write] が効くのは、**砂箱の掛かる使い方をしたとき**
# — 人間が素の `codex` を打ったときと、艦隊の外の読み取り専用の独立レビュー — だけである。
# use_legacy_landlock の true/false だけで可否を決めない。実効値不明の継承は使わない。
# 正は .claude/directions/orchestration.md §1.1.1 と /mission §0。
# この雛形は無い場合だけ複写する。既存専用設定の許可済みキーだけを移す手順は
# .claude/migrations/2026-09-18-operating-modes.md。認証・履歴・MCP 許可先を保持する。

# 砂箱が許す範囲のことは、問わずにそのまま実行する。
# **砂箱の外へ出る操作は、このモードでも実行されない**(拒否されるだけで、人間には問わない)。
# **艦隊の起動行は砂箱そのものを外す**(`danger-full-access`)ので、そちらでは
# 「砂箱の外」という境界自体が無くなる。守るのはホストの隔離である(§1.1.1)。
approval_policy = "never"

[sandbox_workspace_write]
# true は掲示板専用の許可ではなく通常のネットワークも開く。外部通信は環境側で制限する。
# 掲示板(colabtmux)は tmux のソケットを使う。これが false だと、書けるのに相手が起きない。
network_access = true

# **`/tmp` と `$TMPDIR` は、このモードの既定で書ける。** スクリプトの中間ファイルや
# テストの作業領域がそこに出るので、書けることが前提である。
#
# **上位の `~/.codex/config.toml` がそれを外している環境でだけ**、下の2行を戻す
# (外す側の設定なので、`false` が「書ける」である):
#     `exclude_slash_tmp = false` と `exclude_tmpdir_env_var = false` の2行
