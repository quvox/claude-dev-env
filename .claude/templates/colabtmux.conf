# colabtmux の設定(TOML)。**このファイルはコミットして共有する。**
# 正は `.claude/directions/orchestration.md` §1。
#
# **エージェントの顔ぶれは1体も書かない。** どのエージェントを動かすかは設定ではなく、起動のたびに
# 引数で与えるものである(colabtmux D0-core-25)。中央エージェントは `start` の引数で、
# 作業エージェントは中央エージェントが出す `agent spawn` の引数で決まる(orchestration.md §3)。
# **書けるのは「種ごとの既定の起動コマンド」だけ**である(`[agent_kind.<種>] command`。
# `start` で `-- <起動コマンド>` を省いたときにだけ使われ、`agent spawn` は今も必ず引数で受ける)。
# colabtmux の既定は `["claude"]` で**引数が1つも付かない**ので、**この雛形は下の
# `[agent_kind.claude]` でそれを埋めてある** — 起動行を省いても中央エージェントが役の規範を持って
# 起きるようにするためである(理由と実際の事故はその節のコメント)。**起動行に書くこととの二重は
# 意図的である**: 片方だけにすると、落とした側がそのまま事故になる。
#
# **設定が無くても `start` は始められる**(無ければ `start` がこのファイルを作り、`.gitignore` に
# 状態の置き場所の1行を足す。`--project <名>` 省略時はディレクトリ名)。それでもこの雛形を先に
# 置くのは、**この運用に要る値が3つ入っている**からである — `[delivery] max_attempts` /
# `[notify]`(人間を呼ぶ知らせ役)/ `[wait] timeout_ms`。
#
# 人間の手順はこれだけである(**`tmux attach` は要らない。`start` がそのまま接続する**):
#   /setup                                               # このファイルと AGENTS.md を複写するのはここ
#   colabtmux start -- claude --permission-mode auto --model opus --effort high \
#     --append-system-prompt-file .claude/roles/orchestrator.md
# `/setup` をまだ1度も走らせていないなら、1行目の代わりに手で2本(`start` より先に):
#   cp .claude/templates/colabtmux.conf colabtmux.conf   # [project] name を直す
#   cp .claude/templates/AGENTS.md AGENTS.md             # codex を混ぜるなら
#
# **`--permission-mode auto` は落とさない。** 承認を人間に求めるウィンドウは、この運用では止まったウィンドウと
# 同じである(orchestration.md §1.1.1)。作業エージェントも同じモードで起こされる。
# codex を混ぜるなら、**そのディレクトリで一度 `codex` を起動して信頼を与えておく**
# (未信頼だと起動直後に問いで止まり、作業指示が届かない)。**codex の起動引数は3つで1組**である
# (`--sandbox workspace-write --ask-for-approval never` に
# `-c sandbox_workspace_write.network_access=true` を足す)。
# この `-c` を落とすと codex はこの掲示板を扱えない — 正と理由は orchestration.md §1.1.1。
# **`@qa` のウィンドウだけは砂箱なしの別の1行である**(同 §1.1.1「`@qa` だけは砂箱なしで起こす」)。
# `features.use_legacy_landlock` は起動行で渡さない(非推奨の旗。§1.1.1)。
#
# **`--append-system-prompt-file` を知らない claude だと、ウィンドウが開いた瞬間に落ちる。** そのときは
# その引数を落として `colabtmux start -- claude --permission-mode auto` で始め、開いたウィンドウで
# 「.claude/roles/orchestrator.md を読んでから /mission <ミッション>」と打つ(役の規範が
# 引数で入らないぶん、読ませるのは人間の1手になる)。
#
# 2度目の `start` は**何も作らずに失敗する**(中央エージェントを2体にしない)。
# 入り直すのは `tmux attach -t <name>` である。
#
# **colabtmux が起動時に生やすファイル**(教え込み。中身は colabtmux のものなので編集しない):
#   .claude/skills/colabtmux/SKILL.md   claude 向け(ファイルごと置き換わる)
#   AGENTS.md / GEMINI.md               codex / gemini 向け(管理ブロックの中だけ)
#
# 省略した項目は colabtmux の既定値が使われる。項目の完全な定義は colabtmux 側の
# `docs/02-design/contracts/conf.md`。

[project]
# tmux のセッション名になる。**このプロジェクトのディレクトリ名にする。**
# **Slack へ出る知らせの `[<名前>]` もこれである**(`<時刻> [<名前>] <文>`。orchestration.md §6.1)。
# ここを直し忘れると、1つのチャンネルに集まる全プロジェクトが `[PROJECT]` と名乗る。
name = "PROJECT"

# **`colabtmux start` で `-- <起動コマンド>` を省いたときに使われる既定**(`agent spawn` は今も必ず
# 引数で受けるので、作業エージェントの起こし方はこの行の影響を受けない)。**併合はキー単位**なので、
# `command` だけ書いても他の既定値(受信可否判定・教え込みの配布先)はそのまま残る。
#
# **これが無いと、省略された `start` は引数ゼロの `claude` を起こす。** そのウィンドウは役の規範を持たず、
# 自分が中央エージェントだと知らないまま全部自分でやる(2026-08-18 の事故。頭のコメント)。
# `--append-system-prompt-file` を知らない claude ではウィンドウが開いた瞬間に落ちるので、
# そのときだけ末尾の2要素を外し、役の規範は人間がウィンドウで読ませる(下のコメントの手順)。
# **モデルと effort もここに書く。** この既定が使われるのは `start`(= 中央エージェント)なので、
# 値は中央の行(`opus` / `high`)である。作業エージェントの値は作業指示ごとに違い、`agent spawn` の
# 引数で渡る。正は `.claude/directions/orchestration.md` §1.5 の表。
# 落とすと `~/.claude` の既定を継承するので、**表と違うモデルで中央が走っていても画面には出ない**。
[agent_kind.claude]
command = ["claude", "--permission-mode", "auto",
           "--model", "opus", "--effort", "high",
           "--append-system-prompt-file", ".claude/roles/orchestrator.md"]

# **この運用でこれを既定のままにしてはならない。**
# 送り込みは相手がキー入力を受け付けられるときだけ成立し、受信不可は試行回数を1つ消費する。
# 1回の試行は受信可否の判定に最大 30 秒(`retry_total_ms`)+ 次の回収までの待ち 10 秒
# (`retry_after_ms`)なので、既定の `max_attempts = 10` では**相手が約7分を超えて生成し続けた
# 依頼が、届かないまま諦められる**(colabtmux `docs/pendings.md` P-005)。実装の作業は数十分
# 動くので、この運用は既定値のままなら必ず踏む。200 なら約2時間の生成に耐える。
# 上限に達しても**メッセージは消えない**が、配信は諦められ、誰も起こされない。
# **ウィンドウが無い宛先はこの回数を消費しない**(経過時間 = `unresolved_ttl_ms` 既定24時間で終着する)ので、
# ここを上げても「死んだ相手への試行が長引く」ことは起きない。
[delivery]
max_attempts = 200

# 1回の `wait` の上限。**長い待ちはここに載せない** — シェルの呼び出しが待てるのは
# 10分までなので、それを超える待ちは「応答を終えて送り込みで起きる」形にする
# (orchestration.md §3.1)。ここは短い待ち(調査・立案・独立レビュー)のための値である。
[wait]
timeout_ms = 540000

# **知らせ役** — colabtmux の監視が「止まったウィンドウ」を見つけたときに、これを1回実行する
# (末尾に知らせの文が足されて渡る。orchestration.md §6.1)。**これが3つ目の音である。**
# 空のままなら停止は誰にも知らされない(既定は空 = 知らせを出さない)。
# 資格情報はここに書かない — スクリプトが `SLACK_BOT_TOKEN` / `SLACK_CHANNEL` を環境から読む。
[notify]
command = ["python3", ".claude/scripts/notify-slack.py", "--notice"]

# **監視の設定は3項目だけ**で、この運用では既定のままでよい(参考のため値を書いてある)。
# `exclude_windows` = **人間が直接見ている画面**は見ない。そこが止まったことは人間が先に知る。
# 見る区間は「配信が届いてから、その相手が投稿するまで」だけであり、それ以外は誰も見ない。
# **`discuss-1` が入っているのは 2026-08-22 からである**(`orchestration.md` §1.6)。
# 議論用のウィンドウは**人間の入力を待って静止する**ので、既定のままだと「止まった」と
# 判定されて誤報が鳴る — 監視が誤報を出さないのは、**生成し続ける相手についてだけ**である。
# **受け止めは二重である**: 規範が受領の1行を義務づけて配信の区間を閉じ(§1.6)、この行が
# 取りこぼしを拾う。**照合は完全一致なので**(前方一致は無い)、議論用の ID は
# `discuss-1` に固定する。**作業エージェントの ID は起こした時刻を番号にするので毎回変わるが**
# (`worker-251432`。orchestration.md §1.0)、**議論用だけはこの行のためにその規則から外してある。**
# `stall_after_ms` を 300000 未満にするなら `[notify] timeout_ms` も一緒に下げること
# (知らせ役の上限はこの 1/30 以下でなければ読み込みが失敗する)。
[monitor]
interval_ms = 30000
stall_after_ms = 300000
exclude_windows = ["orchestrator", "discuss-1"]
