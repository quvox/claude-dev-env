name: Build and push images to GHCR

# コンテナイメージ（claude / claude-vnc / docker-proxy）を GHCR へ毎日・マルチアーキ
# (amd64/arm64) で push する。タグは YYYYMMDDHHmm(JST) と latest。
# 設計: docs/02-design/system.md / 実装説明書: docs/03-impl/ghcr-workflow.md
on:
  schedule:
    - cron: '30 18 * * *'   # 03:30 JST 毎日（UTC 18:30）
  workflow_dispatch:
    inputs:
      claude_version:
        description: '同梱する Claude Code のバージョン（stable / latest / 2.1.220 等）。空なら latest チャネルを自動解決'
        required: false
        default: ''
      codex_version:
        description: '同梱する Codex CLI のバージョン（latest / 0.146.0 等）。空なら npm registry の最新版を自動解決'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # --- タグ(YYYYMMDDHHmm, JST)・小文字オーナー名・同梱エージェント CLI
  #     （Claude Code / Codex CLI）の具体バージョンを 1 度だけ算出し後続で一貫利用
  #     （6 つの build ジョブが個別に latest を引くと、解決タイミング差で amd64/arm64 に
  #     別バージョンが入りうるため）---
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
      claude_version: ${{ steps.meta.outputs.claude_version }}
      codex_version: ${{ steps.meta.outputs.codex_version }}
    steps:
      - id: meta
        env:
          CLAUDE_VERSION_INPUT: ${{ inputs.claude_version }}
          CODEX_VERSION_INPUT: ${{ inputs.codex_version }}
        run: |
          set -euo pipefail
          echo "tag=$(TZ=Asia/Tokyo date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

          # 同梱する Claude Code のバージョン（D-26）:
          # 手動入力があればそれを採用（不良版を引いた際の切り戻し手段）。
          # 空（スケジュール実行を含む）なら latest チャネルを具体バージョンへ解決する。
          # CLAUDE_VERSION=latest のまま渡すと文字列が変化せずキャッシュキーとして機能せず、
          # 「ラベルだけ日次更新され中身が凍結する」問題が再発するため必ず解決してから渡す。
          if [ -n "${CLAUDE_VERSION_INPUT}" ]; then
            claude_version="${CLAUDE_VERSION_INPUT}"
            echo "同梱バージョン（手動指定）: ${claude_version}"
          else
            claude_version="$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)"
            echo "同梱バージョン（latest チャネル解決）: ${claude_version}"
            # 取得値が HTML エラーページ等で壊れていたら、install.sh の引数
            # バリデーションで落ちる前に prepare で失敗させる（原因追跡を近くに保つ）。
            if ! echo "${claude_version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::latest チャネルの解決結果が MAJOR.MINOR.PATCH 形式ではありません: ${claude_version}"
              exit 1
            fi
          fi
          echo "claude_version=${claude_version}" >> "$GITHUB_OUTPUT"

          # 同梱する Codex CLI のバージョン（D-27）:
          # claude と同じ方針。手動入力があればそれを採用し、空なら npm registry の
          # dist-tag latest を具体バージョンへ解決する（@latest のまま渡すと文字列が
          # 変化せずキャッシュキーとして機能しないため必ず解決してから渡す）。
          if [ -n "${CODEX_VERSION_INPUT}" ]; then
            codex_version="${CODEX_VERSION_INPUT}"
            echo "同梱バージョン（手動指定）: codex ${codex_version}"
          else
            codex_version="$(curl -fsSL https://registry.npmjs.org/@openai/codex/latest | jq -r '.version')"
            echo "同梱バージョン（npm registry 解決）: codex ${codex_version}"
            # registry 不達や JSON 不正（null 等）はここで落とす。npm install に渡してから
            # 落ちるとビルド後半になり原因追跡が遠くなる。
            if ! echo "${codex_version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::npm registry の解決結果が MAJOR.MINOR.PATCH 形式ではありません: ${codex_version}"
              exit 1
            fi
          fi
          echo "codex_version=${codex_version}" >> "$GITHUB_OUTPUT"

  # --- 3 イメージ × 2 アーキをネイティブ runner で並行ビルドし push-by-digest ---
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: claude,        dockerfile: .devcontainer/Dockerfile.claude,        target: claude-cli }
          - { name: claude-vnc,    dockerfile: .devcontainer/Dockerfile.claude,        target: claude-vnc }
          - { name: docker-proxy,  dockerfile: .devcontainer/Dockerfile.docker-proxy,  target: "" }
        platform:
          - { arch: amd64, runner: ubuntu-latest,     docker: linux/amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm,  docker: linux/arm64 }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.docker }}
          # 特定ユーザーに紐づけない generic user で焼く（UID/GID は実行時に entrypoint が
          # /workspace 所有者へ追従。docs/10_ghcr-images.md「pull して使う運用」）。
          # docker-proxy はこれらの ARG を宣言しないため無視される（警告のみ）。
          #
          # CLAUDE_VERSION / CODEX_VERSION は build-arg で渡してよい——内容由来の値であり、
          # かつ参照する層が配布ステージの終端レイヤーに限られるため、失効の波及先が各
          # エージェント CLI のバイナリ層だけに留まる（D-26 / D-27 / 02-design 判断4）。
          build-args: |
            USERNAME=dev
            USER_UID=1000
            USER_GID=1000
            CLAUDE_VERSION=${{ needs.prepare.outputs.claude_version }}
            CODEX_VERSION=${{ needs.prepare.outputs.codex_version }}
          # バージョン(日次で変わるタイムスタンプ)は build-arg=IMAGE_VERSION として
          # Dockerfile の LABEL 経由でレイヤーチェーンに載せると、その層以降の
          # レイヤーキャッシュが毎日失効し（cache-from が効かず）、pull が毎回
          # 全レイヤー再取得になる。そのため build-arg では渡さず、最終イメージへ
          # labels 入力で付与する（export 時のメタデータ＝レイヤーキャッシュに影響しない）。
          labels: |
            io.github.quvox.claude-dev.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/claude-dev-${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # --- 各イメージの amd64/arm64 ダイジェストを manifest list に統合しタグ付け push ---
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_name: [claude, claude-vnc, docker-proxy]
    steps:
      # 前置一致（例: digests-claude-* が digests-claude-vnc-* も拾う）を避けるため
      # アーキ名まで含めた exact 名で 2 回ダウンロードして同一ディレクトリへ集約する。
      - name: Download digest (amd64)
        uses: actions/download-artifact@v8
        with:
          name: digests-${{ matrix.image_name }}-amd64
          path: ${{ runner.temp }}/digests
      - name: Download digest (arm64)
        uses: actions/download-artifact@v8
        with:
          name: digests-${{ matrix.image_name }}-arm64
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/claude-dev-${{ matrix.image_name }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.prepare.outputs.tag }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/claude-dev-${{ matrix.image_name }}"
          docker buildx imagetools inspect "${IMAGE}:${{ needs.prepare.outputs.tag }}"
